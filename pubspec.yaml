name: himnario_evangelico_b3
description: "Himnario Iglesia Cristiana Evangélica - App de himnos con búsqueda y favoritos."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.0
  path: ^1.9.0
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  stream_transform: ^2.1.0
  shared_preferences: ^2.3.0
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/dbHimnosEstructuraCompleta.db
    - assets/bible/RVR1960/
    - assets/bible/NVI/
    - assets/bible/NTV/
    - assets/bible/DHH/
    - assets/bible/TLA/
    - assets/bible/PDT/
    - assets/bible/BDO/
